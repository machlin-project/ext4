            find "$exports" "$checked" -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
      - name: Independently verify reserved mapping capacity on full filesystems
        if: matrix.suite == 'namespace'
        run: |
          for mode in root tree fault; do
            exports="artifacts/reservation-$mode-exports"
            checked="artifacts/reservation-$mode-independent"
            mkdir "$exports"
            options=()
            case "$mode" in
              root)
                flag=--reservation
                profiles=(1k 4k no-checksum no-filetype inode128 checksum-seed orphan-file)
                ;;
              tree)
                flag=--reservation-tree
                profiles=(1k 4k)
                options=(--tree)
                ;;
              fault)
                flag=--reservation-faults
                profiles=(1k inode128)
                options=(--faults --recover .build/ext4-recover)
                ;;
            esac
            for profile in "${profiles[@]}"; do
              .build/ext4-file-range-test "$flag" --export "$exports" \
                "artifacts/space-fixtures/space-$profile.img"
            done 2>&1 | tee "artifacts/checks/reservation-$mode-exports.log"
            python3 tests/check_reservation.py "${options[@]}" \
              --fixtures artifacts/space-fixtures --exports "$exports" --output "$checked" \
              2>&1 | tee "artifacts/checks/reservation-$mode-independent.log"
            find "$exports" "$checked" -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
      - name: Independently verify unlink and rmdir transactions
        if: matrix.suite == 'removal'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/removal-exports/$profile"
              checked="artifacts/removal-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-removal-test --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/removal-$profile-exports.log"
              python3 tests/check_namespace.py --fixtures "$fixtures" --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/removal-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify rename transactions
        if: matrix.suite == 'rename'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/rename-exports/$profile"
              checked="artifacts/rename-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-rename-test --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/rename-$profile-exports.log"
              .build/ext4-rename-test --whiteout --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/whiteout-$profile-exports.log"
              python3 tests/check_rename.py --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/rename-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify indexed namespace and split recovery
        if: matrix.suite == 'indexed'
        run: |
          mkdir artifacts/index-capacity-exports
          .build/ext4-index-write-test --capacity --export artifacts/index-capacity-exports \
            artifacts/index-capacity-fixture/index-capacity.img 2>&1 | tee artifacts/checks/index-capacity-exports.log
          python3 tests/check_index_capacity.py --fixture artifacts/index-capacity-fixture/report.json \
            --image artifacts/index-capacity-exports/indexed-capacity-reused-index-capacity.img \
            --output artifacts/index-capacity-independent \
            2>&1 | tee artifacts/checks/index-capacity-independent.log
          for image in artifacts/index-fixtures/*.img; do
            name="${image##*/}"
            profile="${name%.img}"
            exports="artifacts/index-exports/$profile"
            checked="artifacts/index-independent/$profile"
            mkdir -p "$exports"
            .build/ext4-index-write-test --export "$exports" "$image" \
              2>&1 | tee "artifacts/checks/index-$profile-functional.log"
            python3 tests/check_index_write.py --fixtures artifacts/index-fixtures/report.json \
              --case "$name" --exports "$exports" --output "$checked-functional" \
              2>&1 | tee "artifacts/checks/index-$profile-functional-independent.log"
            .build/ext4-index-write-test --fault-smoke --export "$exports" "$image" \
              2>&1 | tee "artifacts/checks/index-$profile-split-exports.log"
            python3 tests/check_index_faults.py --exports "$exports" --recover .build/ext4-recover \
              --output "$checked-splits" 2>&1 | tee "artifacts/checks/index-$profile-splits-independent.log"
            case "$name" in
              index-2k.img|index-4k.img|index-8k.img|index-16k.img|index-32k.img) ;;
              *)
                .build/ext4-index-write-test --edges artifacts/index-collisions/vectors.txt \
                  --export "$exports" "$image" 2>&1 | tee "artifacts/checks/index-$profile-edges.log"
                python3 tests/check_index_edges.py --fixtures artifacts/index-fixtures/report.json \
                  --vectors artifacts/index-collisions/report.json --case "$name" --exports "$exports" \
                  --output "$checked-edges" 2>&1 | tee "artifacts/checks/index-$profile-edges-independent.log"
                ;;
            esac
            find "$exports" "$checked"-* -type f \
              ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
          df -h .
      - name: Independently verify large-directory mutations and recovery
        if: matrix.suite == 'indexed'
        run: |
          exports=artifacts/large-directory-exports
          mkdir "$exports"
          for profile in index-large-dir index-large-dir-indirect index-large-dir-gdt; do
            .build/ext4-index-write-test --export "$exports" \
              "artifacts/large-directory-fixtures/$profile.img" \
              2>&1 | tee "artifacts/checks/$profile-functional-exports.log"
            for transition in grow cascade; do
              .build/ext4-index-write-test --fault-smoke --large-split "$transition" --export "$exports" \
                "artifacts/large-directory-edge-fixtures/$profile-$transition.img" \
                2>&1 | tee "artifacts/checks/$profile-$transition-exports.log"
            done
            .build/ext4-index-write-test --capacity --export "$exports" \
              "artifacts/large-directory-edge-fixtures/$profile-capacity.img" \
              2>&1 | tee "artifacts/checks/$profile-capacity-exports.log"
            python3 tests/check_index_capacity.py --fixture artifacts/large-directory-edge-fixtures/report.json \
              --case "$profile-capacity.img" --image "$exports/indexed-capacity-reused-$profile-capacity.img" \
              --output "artifacts/large-directory-independent/$profile-capacity" \
              2>&1 | tee "artifacts/checks/$profile-capacity-independent.log"
          done
          .build/ext4-index-write-test --fault-smoke --large-split grow --export "$exports" \
            artifacts/large-directory-fixtures/index-large-dir-capacity.img \
            2>&1 | tee artifacts/checks/large-directory-full-root-exports.log
          python3 tests/check_index_write.py --fixtures artifacts/large-directory-fixtures/report.json \
            --case index-large-dir.img --case index-large-dir-indirect.img --case index-large-dir-gdt.img \
            --exports "$exports" --output artifacts/large-directory-independent/functional \
            2>&1 | tee artifacts/checks/large-directory-functional-independent.log
          python3 tests/check_index_faults.py --exports "$exports" --recover .build/ext4-recover \
            --output artifacts/large-directory-independent/splits \
            2>&1 | tee artifacts/checks/large-directory-splits-independent.log
          find "$exports" artifacts/large-directory-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify directory creation and link-count overflow
        if: matrix.suite == 'indexed'
        run: |
          exports=artifacts/directory-growth-exports
          mkdir "$exports"
          for image in artifacts/fixtures/*.img artifacts/namespace-fixtures/namespace-no-filetype.img; do
            case "${image##*/}" in ext4-indexed.img|ext4-64k.img) continue ;; esac
            .build/ext4-index-write-test --create-index --fault-smoke --export "$exports" "$image" \
              2>&1 | tee "artifacts/checks/directory-create-${image##*/}.log"
          done
          .build/ext4-index-write-test --create-index --fault-smoke --export "$exports" \
            artifacts/directory-large-block-fixture/directory-64k.img \
            2>&1 | tee artifacts/checks/directory-create-64k.log
          .build/ext4-index-write-test --directory-links-image --export "$exports" \
            artifacts/directory-links-fixture/directory-links.img \
            2>&1 | tee artifacts/checks/directory-links-exports.log
          python3 tests/check_index_faults.py --exports "$exports" --recover .build/ext4-recover \
            --output artifacts/directory-growth-independent \
            2>&1 | tee artifacts/checks/directory-growth-independent.log
          find "$exports" artifacts/directory-growth-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Export and independently verify sustained operation
        if: matrix.suite == 'sustained'
        run: |
          seed=101
          exports=()
          for image in ext4-4k.img ext4-1k.img ext4-indirect-1k.img ext4-inode128.img; do
            directory="artifacts/sustained-exports/${image%.img}"
            mkdir -p "$directory"
            .build/ext4-sustained-test "artifacts/fixtures/$image" "$seed" 1500 \
              --export "$directory" 2>&1 | tee "artifacts/checks/sustained-export-${image%.img}.log"
            exports+=(--exports "$directory")
            seed=$((seed + 1))
          done
          directory=artifacts/sustained-exports/quota-1k-ea-inode
          mkdir -p "$directory"
          .build/ext4-sustained-test artifacts/quota-fixtures/quota-1k-ea-inode.img "$seed" 1500 \
            --export "$directory" 2>&1 | tee artifacts/checks/sustained-export-quota-1k-ea-inode.log
          exports+=(--exports "$directory")
          seed=$((seed + 1))
          directory=artifacts/sustained-exports/ext4-4k-wide
          mkdir -p "$directory"
          .build/ext4-sustained-test artifacts/fixtures/ext4-4k.img "$seed" 3000 --objects 1000 \
            --entries 2000 --directories 3 --export "$directory" \
            2>&1 | tee artifacts/checks/sustained-export-ext4-4k-wide.log
          exports+=(--exports "$directory")
          python3 tests/check_sustained.py --tools-root vendor/e2fsprogs/build "${exports[@]}" \
            --output artifacts/sustained-independent 2>&1 | tee artifacts/checks/sustained-independent.log
          find artifacts/sustained-exports artifacts/sustained-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' ! -name 'manifest.txt' -delete
      - name: Independently verify multi-mount protection
        if: matrix.suite == 'format'
        run: |
          exports=artifacts/mmp-exports
          mkdir -p "$exports"
          for profile in 4k 1k no-checksum; do
            .build/ext4-mmp-test "artifacts/mmp-fixtures/mmp-$profile.img" "$exports" \
              2>&1 | tee "artifacts/checks/mmp-export-$profile.log"
          done
          python3 tests/check_mmp.py --tools-root vendor/e2fsprogs/build --exports "$exports" \
            --recover .build/ext4-recover --e2fsck-write 4k --output artifacts/mmp-independent \
            2>&1 | tee artifacts/checks/mmp-independent.log
          find "$exports" artifacts/mmp-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify fs-verity files after writable changes
        if: matrix.suite == 'format'
        run: |
          exports=()
          for profile in 4k 1k-salted sha512; do
            directory="artifacts/verity-exports/$profile"
            mkdir -p "$directory"
            .build/ext4-verity-test "artifacts/verity-fixtures/verity-$profile.img" \
              "artifacts/verity-fixtures/verity-$profile.manifest" "$directory" \
              2>&1 | tee "artifacts/checks/verity-export-$profile.log"
            exports+=(--exports "$directory")
          done
          python3 tests/check_verity.py --tools-root vendor/e2fsprogs/build "${exports[@]}" \
            --output artifacts/verity-independent 2>&1 | tee artifacts/checks/verity-independent.log
          find artifacts/verity-exports artifacts/verity-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' ! -name '*.manifest' -delete
      - name: Independently verify casefolded directories after writable changes
        if: matrix.suite == 'format'
        run: |
          exports=()
          for profile in 4k-strict 1k-relaxed; do
            directory="artifacts/casefold-exports/$profile"
            mkdir -p "$directory"
            .build/ext4-casefold-fs-test "artifacts/casefold-fixtures/casefold-$profile.img" \
              "artifacts/casefold-fixtures/casefold-$profile.manifest" "$directory" \
              2>&1 | tee "artifacts/checks/casefold-export-$profile.log"
            exports+=(--exports "$directory")
          done
          python3 tests/check_casefold.py --tools-root vendor/e2fsprogs/build "${exports[@]}" \
            --output artifacts/casefold-independent 2>&1 | tee artifacts/checks/casefold-independent.log
          find artifacts/casefold-exports artifacts/casefold-independent artifacts/casefold-vectors \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify quota usage after writable changes
        if: matrix.suite == 'format'
        run: |
          exports=()
          for profile in 4k 1k-ea-inode bigalloc; do
            directory="artifacts/quota-exports/$profile"
            mkdir -p "$directory"
            .build/ext4-quota-test "artifacts/quota-fixtures/quota-$profile.img" "$directory" \
              2>&1 | tee "artifacts/checks/quota-export-$profile.log"
            .build/ext4-quota-test --faults "artifacts/quota-fixtures/quota-$profile.img" \
              "$directory" 2>&1 | tee "artifacts/checks/quota-fault-export-$profile.log"
            exports+=(--exports "$directory")
          done
          python3 tests/check_quota.py --tools-root vendor/e2fsprogs/build "${exports[@]}" \
            --output artifacts/quota-independent 2>&1 | tee artifacts/checks/quota-independent.log
          find artifacts/quota-exports artifacts/quota-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Remove fixture-host symlinks before artifact discovery
        if: always()
        run: |
          if [[ -d artifacts ]]; then
            find artifacts -type l -delete
          fi
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-filesystem-${{ matrix.suite }}-reports
          retention-days: 7
          include-hidden-files: true
          path: |
            artifacts/**/*.log
            artifacts/**/*.json
            artifacts/**/*.xml
            artifacts/fixtures/features.txt
            artifacts/fixtures/tool-versions.txt
            .build/meson-logs/meson-log.txt
            .build/meson-logs/testlog.txt
            .build/meson-logs/testlog.json
            .build/meson-logs/testlog.junit.xml
            .build/meson-info/intro-tests.json

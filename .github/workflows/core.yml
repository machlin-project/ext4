name: Portable filesystem

on:
  push:
    branches: [development, main]
    paths-ignore: ['**/*.md', '.clang-format']
  pull_request:
    paths-ignore: ['**/*.md', '.clang-format']
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run after a change limited to its tests or fixtures
        type: choice
        default: all
        options: [all, core, fast-commit, orphan-file, namespace, removal, rename, indexed, sustained,
          format]

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}-${{ inputs.suite || 'all' }}
  # Complete the active acceptance run while the newest source waits its turn.
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # Leave headroom for the full fault and independent image suites on shared runners.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ inputs.suite != '' && inputs.suite != 'all' && fromJSON(format('["{0}"]', inputs.suite)) || fromJSON('["core","fast-commit","orphan-file","namespace","removal","rename","indexed","sustained","format"]') }}
    env:
      CC: clang
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang meson ninja-build build-essential pkg-config
          meson --version
          ninja --version
      # Older journal-only recovery leaves orphan_present set after cleanup.
      # Keep the independent oracle on the same fixed upstream release as the lab.
      - name: Check out e2fsprogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tytso/e2fsprogs
          ref: da631e117dcf8797bfda0f48bdaa05ac0fbcf7af # v1.47.3
          path: vendor/e2fsprogs
          persist-credentials: false
      - name: Build independent filesystem tools
        run: |
          mkdir -p artifacts/checks vendor/e2fsprogs/build
          (
            cd vendor/e2fsprogs/build
            ../configure --disable-nls --disable-fuse2fs --disable-libarchive
            make --jobs=2
          ) 2>&1 | tee artifacts/checks/e2fsprogs-build.log
          for directory in misc e2fsck debugfs; do
            echo "$PWD/vendor/e2fsprogs/build/$directory" >> "$GITHUB_PATH"
          done
      - name: Generate independent images
        run: |
          mkdir -p artifacts/checks
          python3 tests/generate_fixtures.py --extended --inode128 2>&1 | tee artifacts/checks/fixtures.log
          python3 tests/generate_allocation_fixtures.py --fixtures artifacts/fixtures \
            --output artifacts/allocation-fixtures 2>&1 | tee artifacts/checks/allocation-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --output artifacts/orphan-file-fixtures 2>&1 | tee artifacts/checks/orphan-file-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --case ext4-indirect-1k.img --blocks 17 --output artifacts/orphan-file-fixtures/mapped \
            2>&1 | tee artifacts/checks/orphan-file-mapped-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --case ext4-indirect-1k.img --blocks 512 --output artifacts/orphan-file-fixtures/maximum \
            2>&1 | tee artifacts/checks/orphan-file-maximum-fixtures.log
          python3 tests/generate_namespace_fixtures.py --output artifacts/namespace-fixtures \
            2>&1 | tee artifacts/checks/namespace-fixtures.log
      - name: Generate independent indexed images
        if: matrix.suite == 'indexed'
        run: |
          python3 tests/generate_index_fixtures.py --output artifacts/index-fixtures \
            2>&1 | tee artifacts/checks/index-fixtures.log
          python3 tests/generate_index_fixtures.py --capacity --output artifacts/index-capacity-fixture \
            2>&1 | tee artifacts/checks/index-capacity-fixture.log
          python3 tests/generate_index_fixtures.py --large-dir --output artifacts/large-directory-fixtures \
            2>&1 | tee artifacts/checks/large-directory-fixtures.log
          python3 tests/generate_large_directory_edges.py --fixtures artifacts/large-directory-fixtures \
            --output artifacts/large-directory-edge-fixtures \
            2>&1 | tee artifacts/checks/large-directory-edge-fixtures.log
          python3 tests/generate_directory_links.py --output artifacts/directory-links-fixture \
            2>&1 | tee artifacts/checks/directory-links-fixture.log
          python3 tests/generate_directory_links.py --large-block-only --output artifacts/directory-large-block-fixture \
            2>&1 | tee artifacts/checks/directory-large-block-fixture.log
      - name: Generate independently filled block bitmaps
        if: matrix.suite == 'namespace'
        run: |
          python3 tests/generate_space_fixtures.py --output artifacts/space-fixtures \
            2>&1 | tee artifacts/checks/space-fixtures.log
      - name: Generate independent extended attributes
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_xattr_fixtures.py --output artifacts/xattr-fixtures \
            2>&1 | tee artifacts/checks/xattr-fixtures.log
          python3 tests/generate_xattr_space.py --fixtures artifacts/xattr-fixtures/report.json \
            --output artifacts/xattr-space-fixtures 2>&1 | tee artifacts/checks/xattr-space-fixtures.log
          python3 tests/generate_xattr_enable_fixtures.py --output artifacts/xattr-enable-fixtures \
            2>&1 | tee artifacts/checks/xattr-enable-fixtures.log
          python3 tests/generate_ea_inode_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/ea-inode-fixtures 2>&1 | tee artifacts/checks/ea-inode-fixtures.log
      - name: Generate inline files, directories and full block bitmaps
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_inline_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/inline-fixtures 2>&1 | tee artifacts/checks/inline-fixtures.log
          python3 tests/generate_inline_space.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/inline-fixtures/report.json --output artifacts/inline-space-fixtures \
            2>&1 | tee artifacts/checks/inline-space-fixtures.log
      - name: Generate legacy group checksum images
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_group_checksum_fixtures.py --output artifacts/group-checksum-fixtures \
            2>&1 | tee artifacts/checks/group-checksum-fixtures.log
          python3 tests/generate_geometry_fixtures.py --output artifacts/geometry-fixtures \
            2>&1 | tee artifacts/checks/geometry-fixtures.log
      - name: Generate clustered allocation images
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_cluster_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/cluster-fixtures 2>&1 | tee artifacts/checks/cluster-fixtures.log
          python3 tests/generate_cluster_space.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/cluster-fixtures/report.json --output artifacts/cluster-space-fixtures \
            2>&1 | tee artifacts/checks/cluster-space-fixtures.log
      - name: Generate sparse files at logical-address limits
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_large_file_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/large-file-fixtures 2>&1 | tee artifacts/checks/large-file-fixtures.log
      - name: Generate sparse volumes with high physical addresses
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_large_volume_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/large-volume-fixtures 2>&1 | tee artifacts/checks/large-volume-fixtures.log
      - name: Generate filesystem and external-journal device pairs
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_external_journal_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/external-journal-fixtures 2>&1 | tee artifacts/checks/external-journal-fixtures.log
      - name: Generate independent fast-commit inputs and expected filesystems
        if: matrix.suite == 'fast-commit'
        run: |
          python3 tests/generate_fast_commit_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/fast-commit-fixtures 2>&1 | tee artifacts/checks/fast-commit-fixtures.log
      - name: Generate multi-mount-protection and fs-verity images
        if: matrix.suite == 'format'
        run: |
          python3 tests/generate_mmp_fixtures.py --output artifacts/mmp-fixtures \
            2>&1 | tee artifacts/checks/mmp-fixtures.log
          python3 tests/generate_verity_fixtures.py --output artifacts/verity-fixtures \
            2>&1 | tee artifacts/checks/verity-fixtures.log
      - name: Generate casefold vectors and casefolded directories
        if: matrix.suite == 'format'
        run: |
          python3 tests/generate_casefold_vectors.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/casefold-vectors 2>&1 | tee artifacts/checks/casefold-vectors.log
          python3 tests/generate_casefold_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/casefold-fixtures 2>&1 | tee artifacts/checks/casefold-fixtures.log
      - name: Generate quota-tracking images
        if: matrix.suite == 'format' || matrix.suite == 'sustained'
        run: |
          python3 tests/generate_quota_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/quota-fixtures 2>&1 | tee artifacts/checks/quota-fixtures.log
      - name: Generate format and geometry variants
        if: matrix.suite == 'sustained'
        run: |
          python3 tests/generate_format_fixtures.py --tools-root vendor/e2fsprogs/build \
            --output artifacts/format-fixtures 2>&1 | tee artifacts/checks/format-fixtures.log
      - name: Build sanitized and freestanding core
        run: |
          index_options=()
          format_options=()
          space_options=()
          xattr_options=()
          group_options=()
          journal_options=()
          if [[ '${{ matrix.suite }}' == indexed ]]; then
            index_options=(-Dindex_fixtures="$PWD/artifacts/index-fixtures" \
              -Dindex_collisions="$PWD/artifacts/index-collisions/vectors.txt" \
              -Dindex_capacity="$PWD/artifacts/index-capacity-fixture/index-capacity.img" \
              -Dlarge_directory_fixtures="$PWD/artifacts/large-directory-fixtures" \
              -Dlarge_directory_edges="$PWD/artifacts/large-directory-edge-fixtures" \
              -Ddirectory_links_fixture="$PWD/artifacts/directory-links-fixture/directory-links.img" \
              -Ddirectory_index_64k_fixture="$PWD/artifacts/directory-large-block-fixture/directory-64k.img")
          fi
          if [[ '${{ matrix.suite }}' == fast-commit ]]; then
            journal_options=(-Dfast_commit_fixtures="$PWD/artifacts/fast-commit-fixtures")
          fi
          if [[ '${{ matrix.suite }}' == namespace ]]; then
            space_options=(-Dspace_fixtures="$PWD/artifacts/space-fixtures")
          fi
          if [[ '${{ matrix.suite }}' == format ]]; then
            format_options=(-Dmmp_fixtures="$PWD/artifacts/mmp-fixtures" \
              -Dverity_fixtures="$PWD/artifacts/verity-fixtures" \
              -Dcasefold_vectors="$PWD/artifacts/casefold-vectors/vectors.txt" \
              -Dcasefold_fixtures="$PWD/artifacts/casefold-fixtures" \
              -Dquota_fixtures="$PWD/artifacts/quota-fixtures")
          fi
          if [[ '${{ matrix.suite }}' == sustained ]]; then
            format_options=(-Dquota_fixtures="$PWD/artifacts/quota-fixtures" \
              -Dformat_fixtures="$PWD/artifacts/format-fixtures")
          fi
          if [[ '${{ matrix.suite }}' == core ]]; then
            group_options=(-Dgroup_checksum_fixtures="$PWD/artifacts/group-checksum-fixtures" \
              -Dgeometry_fixtures="$PWD/artifacts/geometry-fixtures")
            xattr_options=(-Dxattr_fixtures="$PWD/artifacts/xattr-fixtures" \
              -Dea_inode_fixtures="$PWD/artifacts/ea-inode-fixtures" \
              -Dinline_fixtures="$PWD/artifacts/inline-fixtures" \
              -Dinline_space_fixtures="$PWD/artifacts/inline-space-fixtures" \
              -Dcluster_fixtures="$PWD/artifacts/cluster-fixtures" \
              -Dcluster_space_fixtures="$PWD/artifacts/cluster-space-fixtures" \
              -Dlarge_file_fixtures="$PWD/artifacts/large-file-fixtures" \
              -Dlarge_volume_fixtures="$PWD/artifacts/large-volume-fixtures" \
              -Dexternal_journal_fixtures="$PWD/artifacts/external-journal-fixtures" \
              -Dxattr_space_fixtures="$PWD/artifacts/xattr-space-fixtures" \
              -Dxattr_enable_fixtures="$PWD/artifacts/xattr-enable-fixtures")
          fi
          meson setup .build --buildtype=debugoptimized -Db_sanitize=address,undefined \
            -Dextended_tests=true -Dinode128_test=true -Dunwritten_tests=true \
            -Dorphan_file_tests=true -Dnamespace_tests=true \
            "${index_options[@]}" "${space_options[@]}" "${xattr_options[@]}" "${group_options[@]}" \
            "${format_options[@]}" "${journal_options[@]}" \
            2>&1 | tee artifacts/checks/configure.log
          meson compile -C .build -j 2 2>&1 | tee artifacts/checks/build.log
      - name: Independently verify directory hashes and collision vectors
        if: matrix.suite == 'indexed'
        run: |
          python3 tests/check_directory_hash.py --probe .build/ext4-directory-hash-test \
            --output artifacts/index-hash-independent 2>&1 | tee artifacts/checks/index-hash-independent.log
          python3 tests/generate_index_collisions.py --probe .build/ext4-directory-hash-test \
            --output artifacts/index-collisions 2>&1 | tee artifacts/checks/index-collisions.log
      - name: Run conformance and fault tests
        run: env -i PATH="$PATH" meson test -C .build --no-rebuild -j 2 --suite '${{ matrix.suite }}' --print-errorlogs
      - name: Independently check fast-commit recovery
        if: matrix.suite == 'fast-commit'
        run: |
          python3 tests/check_fast_commit.py --fixtures artifacts/fast-commit-fixtures \
            --tools-root vendor/e2fsprogs/build --recover .build/ext4-recover \
            --output artifacts/fast-commit-independent 2>&1 | tee artifacts/checks/fast-commit-independent.log
      - name: Independently inspect extended attribute representations
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/xattr-exports
          for image in artifacts/xattr-fixtures/*.img; do
            .build/ext4-xattr-test --export artifacts/xattr-exports "$image" "${image%.img}.expected"
          done 2>&1 | tee artifacts/checks/xattr-exports.log
          python3 tests/check_xattrs.py --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-exports --output artifacts/xattr-independent \
            2>&1 | tee artifacts/checks/xattr-independent.log
          find artifacts/xattr-exports artifacts/xattr-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify large attribute values and orphan reclamation
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/ea-inode-exports
          for image in artifacts/ea-inode-fixtures/*.img; do
            .build/ext4-ea-inode-test --export artifacts/ea-inode-exports "$image"
            .build/ext4-ea-inode-test --value-orphans --export artifacts/ea-inode-exports "$image"
          done 2>&1 | tee artifacts/checks/ea-inode-exports.log
          python3 tests/check_ea_inode.py --fixtures artifacts/ea-inode-fixtures/report.json \
            --exports artifacts/ea-inode-exports --output artifacts/ea-inode-independent \
            2>&1 | tee artifacts/checks/ea-inode-independent.log
          mkdir artifacts/ea-inode-fault-exports
          .build/ext4-ea-inode-test --fault-smoke --export artifacts/ea-inode-fault-exports \
            artifacts/ea-inode-fixtures/ea-inode-1k.img artifacts/ea-inode-fixtures/ea-inode-inode128.img \
            2>&1 | tee artifacts/checks/ea-inode-fault-exports.log
          python3 tests/check_ea_inode_faults.py --exports artifacts/ea-inode-fault-exports \
            --recover .build/ext4-recover --output artifacts/ea-inode-fault-independent \
            2>&1 | tee artifacts/checks/ea-inode-fault-independent.log
          find artifacts/ea-inode-fixtures artifacts/ea-inode-exports artifacts/ea-inode-independent \
            artifacts/ea-inode-fault-exports artifacts/ea-inode-fault-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify inline mutation, lifetime and interrupted transactions
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/inline-exports artifacts/inline-full-exports artifacts/inline-fault-exports
          .build/ext4-inline-test --export artifacts/inline-exports artifacts/inline-fixtures/*.img \
            2>&1 | tee artifacts/checks/inline-exports.log
          .build/ext4-inline-test --full --export artifacts/inline-full-exports artifacts/inline-space-fixtures/*.img \
            2>&1 | tee artifacts/checks/inline-full-exports.log
          .build/ext4-inline-test --fault-smoke --export artifacts/inline-fault-exports \
            artifacts/inline-fixtures/inline-1k.img artifacts/inline-fixtures/inline-4k.img \
            2>&1 | tee artifacts/checks/inline-fault-exports.log
          python3 tests/check_inline.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/inline-fixtures/report.json --exports artifacts/inline-exports \
            --output artifacts/inline-independent 2>&1 | tee artifacts/checks/inline-independent.log
          python3 tests/check_inline.py --tools-root vendor/e2fsprogs/build --full \
            --fixtures artifacts/inline-space-fixtures/report.json --exports artifacts/inline-full-exports \
            --output artifacts/inline-full-independent 2>&1 | tee artifacts/checks/inline-full-independent.log
          python3 tests/check_inline_faults.py --tools-root vendor/e2fsprogs/build \
            --exports artifacts/inline-fault-exports --recover .build/ext4-recover \
            --output artifacts/inline-fault-independent 2>&1 | tee artifacts/checks/inline-fault-independent.log
          find artifacts/inline-fixtures artifacts/inline-space-fixtures artifacts/inline-exports \
            artifacts/inline-full-exports artifacts/inline-fault-exports artifacts/inline-independent \
            artifacts/inline-full-independent artifacts/inline-fault-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify clustered allocation and interrupted transactions
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/cluster-exports artifacts/cluster-fault-exports
          .build/ext4-cluster-test --export artifacts/cluster-exports artifacts/cluster-fixtures/*.img \
            2>&1 | tee artifacts/checks/cluster-exports.log
          .build/ext4-cluster-test --full --export artifacts/cluster-exports artifacts/cluster-space-fixtures/*.img \
            2>&1 | tee artifacts/checks/cluster-space-exports.log
          .build/ext4-cluster-test --values --export artifacts/cluster-exports artifacts/cluster-fixtures/cluster-ea-inode.img \
            2>&1 | tee artifacts/checks/cluster-values-exports.log
          .build/ext4-cluster-test --fault-smoke --export artifacts/cluster-fault-exports \
            artifacts/cluster-fixtures/cluster-1k.img artifacts/cluster-fixtures/cluster-4k.img \
            2>&1 | tee artifacts/checks/cluster-fault-exports.log
          python3 tests/check_clusters.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/cluster-fixtures/report.json --exports artifacts/cluster-exports \
            --output artifacts/cluster-independent 2>&1 | tee artifacts/checks/cluster-independent.log
          python3 tests/check_cluster_faults.py --tools-root vendor/e2fsprogs/build \
            --exports artifacts/cluster-fault-exports --recover .build/ext4-recover \
            --output artifacts/cluster-fault-independent 2>&1 | tee artifacts/checks/cluster-fault-independent.log
          python3 tests/check_clusters.py --tools-root vendor/e2fsprogs/build --full \
            --fixtures artifacts/cluster-space-fixtures/report.json --exports artifacts/cluster-exports \
            --output artifacts/cluster-space-independent 2>&1 | tee artifacts/checks/cluster-space-independent.log
          python3 tests/check_clusters.py --tools-root vendor/e2fsprogs/build --values \
            --fixtures artifacts/cluster-fixtures/report.json --exports artifacts/cluster-exports \
            --output artifacts/cluster-values-independent 2>&1 | tee artifacts/checks/cluster-values-independent.log
          find artifacts/cluster-fixtures artifacts/cluster-exports artifacts/cluster-fault-exports \
            artifacts/cluster-independent artifacts/cluster-fault-independent artifacts/cluster-space-fixtures \
            artifacts/cluster-space-independent artifacts/cluster-values-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify large sparse file mutation and reclamation
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/large-file-exports
          .build/ext4-large-file-test --export artifacts/large-file-exports artifacts/large-file-fixtures/*.img \
            2>&1 | tee artifacts/checks/large-file-exports.log
          python3 tests/check_large_files.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/large-file-fixtures/report.json --exports artifacts/large-file-exports \
            --output artifacts/large-file-independent 2>&1 | tee artifacts/checks/large-file-independent.log
          find artifacts/large-file-fixtures artifacts/large-file-exports artifacts/large-file-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify large-volume mutation and recovery
        if: matrix.suite == 'core'
        run: |
          python3 tests/check_large_volumes.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/large-volume-fixtures/report.json \
            --test .build/ext4-large-volume-test --recover .build/ext4-recover \
            --output artifacts/large-volume-independent 2>&1 | tee artifacts/checks/large-volume-independent.log
          find artifacts/large-volume-fixtures artifacts/large-volume-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify paired-device journal transactions and recovery
        if: matrix.suite == 'core'
        run: |
          python3 tests/check_external_journals.py --tools-root vendor/e2fsprogs/build \
            --fixtures artifacts/external-journal-fixtures \
            --test .build/ext4-external-journal-test --recover .build/ext4-recover \
            --output artifacts/external-journal-independent 2>&1 | tee artifacts/checks/external-journal-independent.log
          find artifacts/external-journal-fixtures artifacts/external-journal-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify persistent inode flags and recovery
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/inode-flags-exports
          .build/ext4-inode-flags-test --export artifacts/inode-flags-exports \
            artifacts/xattr-fixtures/xattr-1k.img artifacts/xattr-fixtures/xattr-indirect.img \
            artifacts/xattr-fixtures/xattr-inode128.img \
            2>&1 | tee artifacts/checks/inode-flags-exports.log
          python3 tests/check_inode_flags.py --fixtures artifacts/xattr-fixtures \
            --exports artifacts/inode-flags-exports --output artifacts/inode-flags-independent \
            --recover .build/ext4-recover 2>&1 | tee artifacts/checks/inode-flags-independent.log
          find artifacts/inode-flags-exports artifacts/inode-flags-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify extended attribute transactions and capacity
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/xattr-write-exports artifacts/xattr-edge-exports artifacts/xattr-full-exports
          .build/ext4-xattr-write-test --smoke --export artifacts/xattr-write-exports \
            artifacts/xattr-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-write-exports.log
          .build/ext4-xattr-write-test --edges --export artifacts/xattr-edge-exports \
            artifacts/xattr-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-edge-exports.log
          .build/ext4-xattr-write-test --full --export artifacts/xattr-full-exports \
            artifacts/xattr-space-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-full-exports.log
          python3 tests/check_xattr_writes.py --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-write-exports --recover .build/ext4-recover \
            --output artifacts/xattr-write-independent --discard-recovered \
            2>&1 | tee artifacts/checks/xattr-write-independent.log
          python3 tests/check_xattr_writes.py --edges --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-edge-exports --recover .build/ext4-recover \
            --output artifacts/xattr-edge-independent 2>&1 | tee artifacts/checks/xattr-edge-independent.log
          python3 tests/check_xattr_writes.py --full --fixtures artifacts/xattr-space-fixtures/report.json \
            --exports artifacts/xattr-full-exports --recover .build/ext4-recover \
            --output artifacts/xattr-full-independent 2>&1 | tee artifacts/checks/xattr-full-independent.log
          find artifacts/xattr-space-fixtures artifacts/xattr-write-exports \
            artifacts/xattr-edge-exports artifacts/xattr-full-exports \
            artifacts/xattr-write-independent artifacts/xattr-edge-independent artifacts/xattr-full-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify final release and first attribute transactions
        if: matrix.suite == 'core'
        run: |
          for mode in release enable; do
            fixtures=artifacts/xattr-fixtures
            prefix=xattr-
            if [[ "$mode" == enable ]]; then
              fixtures=artifacts/xattr-enable-fixtures
              prefix=xattr-enable-
            fi
            for image in "$fixtures"/*.img; do
              name=$(basename "$image" .img)
              profile=${name#"$prefix"}

name: Portable filesystem

on:
  push:
    branches: [development, main]
    paths-ignore: ['**/*.md', '.clang-format']
  pull_request:
    paths-ignore: ['**/*.md', '.clang-format']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, orphan-file, namespace, removal, rename, indexed]
    env:
      CC: clang
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang meson ninja-build build-essential pkg-config
          meson --version
          ninja --version
      # Older journal-only recovery leaves orphan_present set after cleanup.
      # Keep the independent oracle on the same fixed upstream release as the lab.
      - name: Check out e2fsprogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tytso/e2fsprogs
          ref: da631e117dcf8797bfda0f48bdaa05ac0fbcf7af # v1.47.3
          path: vendor/e2fsprogs
          persist-credentials: false
      - name: Build independent filesystem tools
        run: |
          mkdir -p artifacts/checks vendor/e2fsprogs/build
          (
            cd vendor/e2fsprogs/build
            ../configure --disable-nls --disable-fuse2fs --disable-libarchive
            make --jobs=2
          ) 2>&1 | tee artifacts/checks/e2fsprogs-build.log
          for directory in misc e2fsck debugfs; do
            echo "$PWD/vendor/e2fsprogs/build/$directory" >> "$GITHUB_PATH"
          done
      - name: Generate independent images
        run: |
          mkdir -p artifacts/checks
          python3 tests/generate_fixtures.py --extended --inode128 2>&1 | tee artifacts/checks/fixtures.log
          python3 tests/generate_allocation_fixtures.py --fixtures artifacts/fixtures \
            --output artifacts/allocation-fixtures 2>&1 | tee artifacts/checks/allocation-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --output artifacts/orphan-file-fixtures 2>&1 | tee artifacts/checks/orphan-file-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --case ext4-indirect-1k.img --blocks 17 --output artifacts/orphan-file-fixtures/mapped \
            2>&1 | tee artifacts/checks/orphan-file-mapped-fixtures.log
          python3 tests/generate_orphan_file_fixtures.py --fixtures artifacts/fixtures \
            --case ext4-indirect-1k.img --blocks 512 --output artifacts/orphan-file-fixtures/maximum \
            2>&1 | tee artifacts/checks/orphan-file-maximum-fixtures.log
          python3 tests/generate_namespace_fixtures.py --output artifacts/namespace-fixtures \
            2>&1 | tee artifacts/checks/namespace-fixtures.log
      - name: Generate independent indexed images
        if: matrix.suite == 'indexed'
        run: |
          python3 tests/generate_index_fixtures.py --output artifacts/index-fixtures \
            2>&1 | tee artifacts/checks/index-fixtures.log
          python3 tests/generate_index_fixtures.py --capacity --output artifacts/index-capacity-fixture \
            2>&1 | tee artifacts/checks/index-capacity-fixture.log
      - name: Generate independently filled block bitmaps
        if: matrix.suite == 'namespace'
        run: |
          python3 tests/generate_space_fixtures.py --output artifacts/space-fixtures \
            2>&1 | tee artifacts/checks/space-fixtures.log
      - name: Generate independent extended attributes
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_xattr_fixtures.py --output artifacts/xattr-fixtures \
            2>&1 | tee artifacts/checks/xattr-fixtures.log
          python3 tests/generate_xattr_space.py --fixtures artifacts/xattr-fixtures/report.json \
            --output artifacts/xattr-space-fixtures 2>&1 | tee artifacts/checks/xattr-space-fixtures.log
          python3 tests/generate_xattr_enable_fixtures.py --output artifacts/xattr-enable-fixtures \
            2>&1 | tee artifacts/checks/xattr-enable-fixtures.log
      - name: Generate legacy group checksum images
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_group_checksum_fixtures.py --output artifacts/group-checksum-fixtures \
            2>&1 | tee artifacts/checks/group-checksum-fixtures.log
      - name: Build sanitized and freestanding core
        run: |
          index_options=()
          space_options=()
          xattr_options=()
          group_options=()
          if [[ '${{ matrix.suite }}' == indexed ]]; then
            index_options=(-Dindex_fixtures="$PWD/artifacts/index-fixtures" \
              -Dindex_collisions="$PWD/artifacts/index-collisions/vectors.txt" \
              -Dindex_capacity="$PWD/artifacts/index-capacity-fixture/index-capacity.img")
          fi
          if [[ '${{ matrix.suite }}' == namespace ]]; then
            space_options=(-Dspace_fixtures="$PWD/artifacts/space-fixtures")
          fi
          if [[ '${{ matrix.suite }}' == core ]]; then
            group_options=(-Dgroup_checksum_fixtures="$PWD/artifacts/group-checksum-fixtures")
            xattr_options=(-Dxattr_fixtures="$PWD/artifacts/xattr-fixtures" \
              -Dxattr_space_fixtures="$PWD/artifacts/xattr-space-fixtures" \
              -Dxattr_enable_fixtures="$PWD/artifacts/xattr-enable-fixtures")
          fi
          meson setup .build --buildtype=debugoptimized -Db_sanitize=address,undefined \
            -Dextended_tests=true -Dinode128_test=true -Dunwritten_tests=true \
            -Dorphan_file_tests=true -Dnamespace_tests=true \
            "${index_options[@]}" "${space_options[@]}" "${xattr_options[@]}" "${group_options[@]}" \
            2>&1 | tee artifacts/checks/configure.log
          meson compile -C .build -j 2 2>&1 | tee artifacts/checks/build.log
      - name: Independently verify directory hashes and collision vectors
        if: matrix.suite == 'indexed'
        run: |
          python3 tests/check_directory_hash.py --probe .build/ext4-directory-hash-test \
            --output artifacts/index-hash-independent 2>&1 | tee artifacts/checks/index-hash-independent.log
          python3 tests/generate_index_collisions.py --probe .build/ext4-directory-hash-test \
            --output artifacts/index-collisions 2>&1 | tee artifacts/checks/index-collisions.log
      - name: Run conformance and fault tests
        run: env -i PATH="$PATH" meson test -C .build --no-rebuild -j 2 --suite '${{ matrix.suite }}' --print-errorlogs
      - name: Independently inspect extended attribute representations
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/xattr-exports
          for image in artifacts/xattr-fixtures/*.img; do
            .build/ext4-xattr-test --export artifacts/xattr-exports "$image" "${image%.img}.expected"
          done 2>&1 | tee artifacts/checks/xattr-exports.log
          python3 tests/check_xattrs.py --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-exports --output artifacts/xattr-independent \
            2>&1 | tee artifacts/checks/xattr-independent.log
          find artifacts/xattr-exports artifacts/xattr-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify extended attribute transactions and capacity
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/xattr-write-exports artifacts/xattr-edge-exports artifacts/xattr-full-exports
          .build/ext4-xattr-write-test --smoke --export artifacts/xattr-write-exports \
            artifacts/xattr-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-write-exports.log
          .build/ext4-xattr-write-test --edges --export artifacts/xattr-edge-exports \
            artifacts/xattr-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-edge-exports.log
          .build/ext4-xattr-write-test --full --export artifacts/xattr-full-exports \
            artifacts/xattr-space-fixtures/*.img 2>&1 | tee artifacts/checks/xattr-full-exports.log
          python3 tests/check_xattr_writes.py --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-write-exports --recover .build/ext4-recover \
            --output artifacts/xattr-write-independent --discard-recovered \
            2>&1 | tee artifacts/checks/xattr-write-independent.log
          python3 tests/check_xattr_writes.py --edges --fixtures artifacts/xattr-fixtures/report.json \
            --exports artifacts/xattr-edge-exports --recover .build/ext4-recover \
            --output artifacts/xattr-edge-independent 2>&1 | tee artifacts/checks/xattr-edge-independent.log
          python3 tests/check_xattr_writes.py --full --fixtures artifacts/xattr-space-fixtures/report.json \
            --exports artifacts/xattr-full-exports --recover .build/ext4-recover \
            --output artifacts/xattr-full-independent 2>&1 | tee artifacts/checks/xattr-full-independent.log
          find artifacts/xattr-space-fixtures artifacts/xattr-write-exports \
            artifacts/xattr-edge-exports artifacts/xattr-full-exports \
            artifacts/xattr-write-independent artifacts/xattr-edge-independent artifacts/xattr-full-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify final release and first attribute transactions
        if: matrix.suite == 'core'
        run: |
          for mode in release enable; do
            fixtures=artifacts/xattr-fixtures
            prefix=xattr-
            if [[ "$mode" == enable ]]; then
              fixtures=artifacts/xattr-enable-fixtures
              prefix=xattr-enable-
            fi
            for image in "$fixtures"/*.img; do
              name=$(basename "$image" .img)
              profile=${name#"$prefix"}
              exports="artifacts/xattr-$mode-exports/$profile"
              checked="artifacts/xattr-$mode-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-xattr-lifetime-test --"$mode" --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/xattr-$mode-$profile-exports.log"
              python3 tests/check_xattr_lifetime.py --"$mode" --fixtures "$fixtures/report.json" \
                --profile "$profile" --exports "$exports" --recover .build/ext4-recover \
                --output "$checked" --discard-recovered \
                2>&1 | tee "artifacts/checks/xattr-$mode-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          find artifacts/xattr-fixtures artifacts/xattr-enable-fixtures -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Export and independently verify file writes
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/write-exports
          .build/ext4-write-test --export-only --export artifacts/write-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            2>&1 | tee artifacts/checks/write-exports.log
          python3 tests/check_writes.py --exports artifacts/write-exports --output artifacts/write-independent \
            2>&1 | tee artifacts/checks/write-independent.log
          find artifacts/write-exports artifacts/write-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify large partial writes
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/partial-write-exports
          .build/ext4-write-partial-test --export artifacts/partial-write-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            2>&1 | tee artifacts/checks/partial-write-exports.log
          python3 tests/check_partial_writes.py --fixtures artifacts/fixtures \
            --exports artifacts/partial-write-exports --output artifacts/partial-write-independent \
            2>&1 | tee artifacts/checks/partial-write-independent.log
          find artifacts/partial-write-exports artifacts/partial-write-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify growth through written preallocation
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/growth-exports
          .build/ext4-write-growth-test --export artifacts/growth-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            2>&1 | tee artifacts/checks/growth-exports.log
          python3 tests/check_growth.py --fixtures artifacts/fixtures \
            --exports artifacts/growth-exports --output artifacts/growth-independent \
            2>&1 | tee artifacts/checks/growth-independent.log
          find artifacts/growth-exports artifacts/growth-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify legacy group checksum mutations
        if: matrix.suite == 'core'
        run: |
          images=(artifacts/group-checksum-fixtures/gdt-1k32.img \
            artifacts/group-checksum-fixtures/gdt-4k64.img \
            artifacts/group-checksum-fixtures/gdt-indirect.img \
            artifacts/group-checksum-fixtures/gdt-inode128.img)
          for mode in write allocation truncate; do
            options=()
            checker=tests/check_writes.py
            checker_options=()
            if [[ "$mode" != write ]]; then
              options=(--"$mode")
              checker=tests/check_allocation.py
            fi
            if [[ "$mode" == truncate ]]; then
              checker_options=(--truncate)
            fi
            exports="artifacts/group-checksum-$mode-exports"
            checked="artifacts/group-checksum-$mode-independent"
            mkdir "$exports"
            .build/ext4-write-test "${options[@]}" --export-only --export "$exports" \
              "${images[@]}" 2>&1 | tee "artifacts/checks/group-checksum-$mode-exports.log"
            python3 "$checker" "${checker_options[@]}" --exports "$exports" --output "$checked" \
              2>&1 | tee "artifacts/checks/group-checksum-$mode-independent.log"
            find "$exports" "$checked" -type f \
              ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
          mkdir artifacts/group-checksum-growth-exports
          .build/ext4-write-growth-test --export artifacts/group-checksum-growth-exports \
            "${images[@]}" 2>&1 | tee artifacts/checks/group-checksum-growth-exports.log
          python3 tests/check_growth.py --fixtures artifacts/group-checksum-fixtures \
            --exports artifacts/group-checksum-growth-exports \
            --output artifacts/group-checksum-growth-independent \
            2>&1 | tee artifacts/checks/group-checksum-growth-independent.log
          mkdir artifacts/group-checksum-namespace-exports
          for options in '--smoke' '--smoke --groups' '--exhaust'; do
            .build/ext4-namespace-test $options --export artifacts/group-checksum-namespace-exports \
              artifacts/group-checksum-fixtures/gdt-small*.img
          done 2>&1 | tee artifacts/checks/group-checksum-namespace-exports.log
          python3 tests/check_namespace.py --fixtures artifacts/group-checksum-fixtures \
            --exports artifacts/group-checksum-namespace-exports --recover .build/ext4-recover \
            --output artifacts/group-checksum-namespace-independent \
            2>&1 | tee artifacts/checks/group-checksum-namespace-independent.log
          find artifacts/group-checksum-growth-exports artifacts/group-checksum-growth-independent \
            artifacts/group-checksum-namespace-exports artifacts/group-checksum-namespace-independent \
            -type f ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Recover independently authored journals
        if: matrix.suite == 'core'
        run: |
          python3 tests/generate_journal_fixtures.py --source artifacts/fixtures/ext4-4k.img \
            --output artifacts/journal-fixtures
          python3 tests/check_journal_recovery.py --fixtures artifacts/journal-fixtures \
            --recover .build/ext4-recover --e2fsck "$(command -v e2fsck)" \
            --output artifacts/journal-independent 2>&1 | tee artifacts/checks/journal-independent.log
          find artifacts/journal-fixtures artifacts/journal-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify allocation and unwritten conversion
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/allocation-exports
          .build/ext4-write-test --allocation --export-only --export artifacts/allocation-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            artifacts/allocation-fixtures/*.img 2>&1 | tee artifacts/checks/allocation-exports.log
          python3 tests/check_allocation.py --exports artifacts/allocation-exports \
            --output artifacts/allocation-independent 2>&1 | tee artifacts/checks/allocation-independent.log
          find artifacts/allocation-exports artifacts/allocation-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify truncate and freed block reuse
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/truncate-exports
          .build/ext4-write-test --truncate --export-only --export artifacts/truncate-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            artifacts/allocation-fixtures/*.img 2>&1 | tee artifacts/checks/truncate-exports.log
          python3 tests/check_allocation.py --truncate --exports artifacts/truncate-exports \
            --output artifacts/truncate-independent 2>&1 | tee artifacts/checks/truncate-independent.log
          find artifacts/truncate-exports artifacts/truncate-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify orphan cleanup
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/orphan-linked-exports
          .build/ext4-orphan-test --smoke --export artifacts/orphan-linked-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            2>&1 | tee artifacts/checks/orphan-linked-exports.log
          python3 tests/check_orphans.py --linked-exports artifacts/orphan-linked-exports \
            --recover .build/ext4-recover --output artifacts/orphan-linked-independent \
            2>&1 | tee artifacts/checks/orphan-linked-independent.log
          e2fsck -fn artifacts/orphan-linked-exports/large-clean-ext4-indirect-1k.img \
            2>&1 | tee artifacts/checks/orphan-large-independent.log
          find artifacts/orphan-linked-exports artifacts/orphan-linked-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify live truncate and recovery
        if: matrix.suite == 'core'
        run: |
          mkdir artifacts/live-exports artifacts/live-large-exports
          .build/ext4-orphan-test --live --smoke --export artifacts/live-exports \
            artifacts/fixtures/ext4-1k.img artifacts/fixtures/ext4-2k.img \
            artifacts/fixtures/ext4-4k.img artifacts/fixtures/ext4-8k.img \
            artifacts/fixtures/ext4-16k.img artifacts/fixtures/ext4-32k.img \
            artifacts/fixtures/ext4-indirect-1k.img artifacts/fixtures/ext4-no-checksum.img \
            artifacts/fixtures/ext4-checksum-seed.img artifacts/fixtures/ext4-inode128.img \
            artifacts/allocation-fixtures/*.img 2>&1 | tee artifacts/checks/live-exports.log
          .build/ext4-orphan-test --live --large --smoke --export artifacts/live-large-exports \
            artifacts/fixtures/ext4-indirect-1k.img 2>&1 | tee artifacts/checks/live-large-exports.log
          python3 tests/check_resize.py --exports artifacts/live-exports --recover .build/ext4-recover \
            --output artifacts/live-independent 2>&1 | tee artifacts/checks/live-independent.log
          python3 tests/check_resize.py --large --exports artifacts/live-large-exports \
            --recover .build/ext4-recover --output artifacts/live-large-independent \
            2>&1 | tee artifacts/checks/live-large-independent.log
          find artifacts/live-exports artifacts/live-large-exports artifacts/live-independent artifacts/live-large-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify orphan-file recovery
        if: matrix.suite == 'orphan-file'
        run: |
          mkdir artifacts/orphan-file-exports artifacts/orphan-file-mixed-exports \
            artifacts/orphan-file-mapped-exports artifacts/orphan-file-maximum-exports \
            artifacts/orphan-file-live-exports
          .build/ext4-orphan-test --orphan-file --smoke --export artifacts/orphan-file-exports \
            artifacts/orphan-file-fixtures/*.img 2>&1 | tee artifacts/checks/orphan-file-exports.log
          .build/ext4-orphan-test --mixed --smoke --export artifacts/orphan-file-mixed-exports \
            artifacts/orphan-file-fixtures/orphan-file-ext4-1k.img \
            artifacts/orphan-file-fixtures/orphan-file-ext4-4k.img \
            2>&1 | tee artifacts/checks/orphan-file-mixed-exports.log
          .build/ext4-orphan-test --orphan-file --smoke --export artifacts/orphan-file-mapped-exports \
            artifacts/orphan-file-fixtures/mapped/*.img 2>&1 | tee artifacts/checks/orphan-file-mapped-exports.log
          .build/ext4-orphan-test --orphan-file --smoke --export artifacts/orphan-file-maximum-exports \
            artifacts/orphan-file-fixtures/maximum/*.img 2>&1 | tee artifacts/checks/orphan-file-maximum-exports.log
          for profile in orphan-file orphan-file-mixed orphan-file-mapped orphan-file-maximum; do
            python3 tests/check_orphans.py --linked-exports "artifacts/$profile-exports" \
              --recover .build/ext4-recover --output "artifacts/$profile-independent" \
              2>&1 | tee "artifacts/checks/$profile-independent.log"
          done
          for image in artifacts/orphan-file*-exports/large-clean-*.img; do
            e2fsck -fn "$image"
          done
          for profile in orphan-file orphan-file-mixed orphan-file-mapped orphan-file-maximum; do
            find "artifacts/$profile-exports" "artifacts/$profile-independent" -type f \
              ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
          .build/ext4-orphan-test --live --smoke --export artifacts/orphan-file-live-exports \
            artifacts/orphan-file-fixtures/*.img 2>&1 | tee artifacts/checks/orphan-file-live-exports.log
          python3 tests/check_resize.py --exports artifacts/orphan-file-live-exports \
            --recover .build/ext4-recover --output artifacts/orphan-file-live-independent \
            2>&1 | tee artifacts/checks/orphan-file-live-independent.log
          find artifacts/orphan-file-live-exports artifacts/orphan-file-live-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          df -h .
      - name: Independently verify namespace transactions
        if: matrix.suite == 'namespace'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/namespace-exports/$profile"
              checked="artifacts/namespace-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-namespace-test --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/namespace-$profile-exports.log"
              if [[ "$fixtures" == artifacts/namespace-fixtures ]]; then
                .build/ext4-namespace-test --smoke --groups --export "$exports" "$image" \
                  2>&1 | tee "artifacts/checks/namespace-$profile-groups.log"
                .build/ext4-namespace-test --exhaust --export "$exports" "$image" \
                  2>&1 | tee "artifacts/checks/namespace-$profile-exhaust.log"
              fi
              python3 tests/check_namespace.py --fixtures "$fixtures" --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/namespace-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify symbolic link transactions
        if: matrix.suite == 'namespace'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/symlink-exports/$profile"
              checked="artifacts/symlink-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-namespace-test --symlinks --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/symlink-$profile-exports.log"
              if [[ "$fixtures" == artifacts/namespace-fixtures ]]; then
                .build/ext4-namespace-test --symlinks --smoke --groups --export "$exports" "$image" \
                  2>&1 | tee "artifacts/checks/symlink-$profile-groups.log"
              fi
              python3 tests/check_namespace.py --fixtures "$fixtures" --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/symlink-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify namespace on full block bitmaps
        if: matrix.suite == 'namespace'
        run: |
          mkdir artifacts/space-exports
          .build/ext4-space-test --export artifacts/space-exports artifacts/space-fixtures/*.img \
            2>&1 | tee artifacts/checks/space-exports.log
          python3 tests/check_space.py --fixtures artifacts/space-fixtures/report.json \
            --exports artifacts/space-exports --output artifacts/space-independent \
            2>&1 | tee artifacts/checks/space-independent.log
          find artifacts/space-exports artifacts/space-independent -type f \
            ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
      - name: Independently verify unlink and rmdir transactions
        if: matrix.suite == 'removal'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/removal-exports/$profile"
              checked="artifacts/removal-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-removal-test --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/removal-$profile-exports.log"
              python3 tests/check_namespace.py --fixtures "$fixtures" --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/removal-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify rename transactions
        if: matrix.suite == 'rename'
        run: |
          for fixtures in artifacts/fixtures artifacts/orphan-file-fixtures artifacts/namespace-fixtures; do
            for image in "$fixtures"/*.img; do
              name="${image##*/}"
              case "$name" in ext4-indexed.img|ext4-64k.img) continue ;; esac
              profile="${name%.img}"
              exports="artifacts/rename-exports/$profile"
              checked="artifacts/rename-independent/$profile"
              mkdir -p "$exports"
              .build/ext4-rename-test --smoke --export "$exports" "$image" \
                2>&1 | tee "artifacts/checks/rename-$profile-exports.log"
              python3 tests/check_rename.py --exports "$exports" \
                --recover .build/ext4-recover --output "$checked" \
                2>&1 | tee "artifacts/checks/rename-$profile-independent.log"
              find "$exports" "$checked" -type f \
                ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
            done
          done
          df -h .
      - name: Independently verify indexed namespace and split recovery
        if: matrix.suite == 'indexed'
        run: |
          mkdir artifacts/index-capacity-exports
          .build/ext4-index-write-test --capacity --export artifacts/index-capacity-exports \
            artifacts/index-capacity-fixture/index-capacity.img 2>&1 | tee artifacts/checks/index-capacity-exports.log
          python3 tests/check_index_capacity.py --fixture artifacts/index-capacity-fixture/report.json \
            --image artifacts/index-capacity-exports/indexed-capacity-reused-index-capacity.img \
            --output artifacts/index-capacity-independent \
            2>&1 | tee artifacts/checks/index-capacity-independent.log
          for image in artifacts/index-fixtures/*.img; do
            name="${image##*/}"
            profile="${name%.img}"
            exports="artifacts/index-exports/$profile"
            checked="artifacts/index-independent/$profile"
            mkdir -p "$exports"
            .build/ext4-index-write-test --export "$exports" "$image" \
              2>&1 | tee "artifacts/checks/index-$profile-functional.log"
            python3 tests/check_index_write.py --fixtures artifacts/index-fixtures/report.json \
              --case "$name" --exports "$exports" --output "$checked-functional" \
              2>&1 | tee "artifacts/checks/index-$profile-functional-independent.log"
            .build/ext4-index-write-test --fault-smoke --export "$exports" "$image" \
              2>&1 | tee "artifacts/checks/index-$profile-split-exports.log"
            python3 tests/check_index_faults.py --exports "$exports" --recover .build/ext4-recover \
              --output "$checked-splits" 2>&1 | tee "artifacts/checks/index-$profile-splits-independent.log"
            case "$name" in
              index-2k.img|index-4k.img|index-8k.img|index-16k.img|index-32k.img) ;;
              *)
                .build/ext4-index-write-test --edges artifacts/index-collisions/vectors.txt \
                  --export "$exports" "$image" 2>&1 | tee "artifacts/checks/index-$profile-edges.log"
                python3 tests/check_index_edges.py --fixtures artifacts/index-fixtures/report.json \
                  --vectors artifacts/index-collisions/report.json --case "$name" --exports "$exports" \
                  --output "$checked-edges" 2>&1 | tee "artifacts/checks/index-$profile-edges-independent.log"
                ;;
            esac
            find "$exports" "$checked"-* -type f \
              ! -name '*.json' ! -name '*.log' ! -name '*.xml' -delete
          done
          df -h .
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-filesystem-${{ matrix.suite }}-reports
          retention-days: 7
          include-hidden-files: true
          path: |
            artifacts/**/*.log
            artifacts/**/*.json
            artifacts/**/*.xml
            artifacts/fixtures/features.txt
            artifacts/fixtures/tool-versions.txt
            .build/meson-logs/meson-log.txt
            .build/meson-logs/testlog.txt
            .build/meson-logs/testlog.json
            .build/meson-logs/testlog.junit.xml
            .build/meson-info/intro-tests.json

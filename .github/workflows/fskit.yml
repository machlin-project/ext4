name: FSKit adapter

on:
  push:
    branches: [development, main]
    paths:
      - '.github/workflows/fskit.yml'
      - 'adapters/fskit/**'
      - 'core/**'
      - 'include/**'
      - 'scripts/build_fskit.py'
      - 'scripts/build_fskit_check.py'
      - 'scripts/combine_fskit_check.py'
      - 'scripts/package_fskit_check.py'
      - 'scripts/package_fskit.py'
      - 'scripts/test_fskit.py'
      - 'scripts/test_fskit_installed_write.py'
      - 'scripts/test_fskit_installed_check.py'
      - 'scripts/test_fskit_installed_format.py'
      - 'scripts/test_fskit_installed_package.py'
      - 'tests/fskit_*.m'
      - 'tests/fskit_*.c'
      - 'tests/crypto.h'
      - 'tests/native_siphash_vectors.h'
      - 'tests/fskit_check_resource.py'
      - 'tests/fskit_format_resource.py'
      - 'tests/run_fskit_check.py'
      - 'tools/maintenance/**'
      - 'tests/mounted_cache.c'
      - 'tests/generate_fixtures.py'
      - 'tests/generate_fskit_owned.py'
  pull_request:
    paths:
      - '.github/workflows/fskit.yml'
      - 'adapters/fskit/**'
      - 'core/**'
      - 'include/**'
      - 'scripts/build_fskit.py'
      - 'scripts/build_fskit_check.py'
      - 'scripts/combine_fskit_check.py'
      - 'scripts/package_fskit_check.py'
      - 'scripts/package_fskit.py'
      - 'scripts/test_fskit.py'
      - 'scripts/test_fskit_installed_write.py'
      - 'scripts/test_fskit_installed_check.py'
      - 'scripts/test_fskit_installed_format.py'
      - 'scripts/test_fskit_installed_package.py'
      - 'tests/fskit_*.m'
      - 'tests/fskit_*.c'
      - 'tests/crypto.h'
      - 'tests/native_siphash_vectors.h'
      - 'tests/fskit_check_resource.py'
      - 'tests/fskit_format_resource.py'
      - 'tests/run_fskit_check.py'
      - 'tools/maintenance/**'
      - 'tests/mounted_cache.c'
      - 'tests/generate_fixtures.py'
      - 'tests/generate_fskit_owned.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fskit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adapter:
    name: Unsigned FSKit with SDK 26.5
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and fixture tools
        run: |
          brew install xcodegen e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
      - name: Record platform and SDK
        run: |
          mkdir -p artifacts/fskit-ci/reports
          {
            sw_vers
            uname -a
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --find clang
            xcodegen --version
          } | tee artifacts/fskit-ci/reports/platform.log
          test "$(xcrun --sdk macosx --show-sdk-version)" = '26.5'
      - name: Generate bounded fixtures
        run: |
          python3 tests/generate_fixtures.py --output artifacts/fskit-ci/fixtures \
            2>&1 | tee artifacts/fskit-ci/reports/fixtures.log
          python3 tests/generate_fskit_owned.py --empty-mib 16 \
            --mke2fs "$(command -v mke2fs)" --debugfs "$(command -v debugfs)" \
            --e2fsck "$(command -v e2fsck)" --output artifacts/fskit-ci/capacity \
            2>&1 | tee artifacts/fskit-ci/reports/capacity-fixtures.log
      - name: Build unsigned app and extension
        run: |
          python3 scripts/build_fskit.py --derived-data artifacts/fskit-ci/DerivedData \
            2>&1 | tee artifacts/fskit-ci/reports/build.log
      - name: Build isolated installer payload
        run: |
          python3 scripts/package_fskit_check.py \
            --output artifacts/fskit-ci/package/Machlin-ext4-check-source.tar.gz \
            2>&1 | tee artifacts/fskit-ci/reports/package-source.log
          python3 scripts/package_fskit.py --allow-unsigned \
            --app 'artifacts/fskit-ci/DerivedData/Build/Products/Debug/Machlin ext4.app' \
            --source-package artifacts/fskit-ci/package/Machlin-ext4-check-source.tar.gz \
            --output artifacts/fskit-ci/package/Machlin-ext4.pkg \
            2>&1 | tee artifacts/fskit-ci/reports/package.log
      - name: Compile native cache checker for both architectures
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror \
            -Wdeclaration-after-statement -O2 -arch arm64 -arch x86_64 \
            tests/mounted_cache.c -o artifacts/fskit-ci/mounted-cache-checker \
            2>&1 | tee artifacts/fskit-ci/reports/mounted-cache-build.log
          python3 -m py_compile scripts/test_fskit_installed_write.py scripts/test_fskit_installed_check.py scripts/test_fskit_installed_format.py scripts/test_fskit_installed_package.py scripts/package_fskit.py
      # No profiles, app installation, native mounts or real Keychain access.
      - name: Check adapter components with sanitizers
        run: |
          python3 scripts/test_fskit.py \
            --derived-data artifacts/fskit-ci/DerivedData \
            --image artifacts/fskit-ci/fixtures/ext4-4k.img \
            --output artifacts/fskit-ci/tests \
            2>&1 | tee artifacts/fskit-ci/reports/components.log
          artifacts/fskit-ci/tests/fskit-volume artifacts/fskit-ci/fixtures/ext4-1k.img \
            2>&1 | tee artifacts/fskit-ci/reports/volume-1k.log
          artifacts/fskit-ci/tests/fskit-volume artifacts/fskit-ci/fixtures/ext4-indexed.img \
            2>&1 | tee artifacts/fskit-ci/reports/volume-indexed.log
          mkdir -p artifacts/fskit-ci/tests-1k
          artifacts/fskit-ci/tests/fskit-mutation artifacts/fskit-ci/fixtures/ext4-1k.img \
            artifacts/fskit-ci/tests-1k/fskit-mutated.img \
            2>&1 | tee artifacts/fskit-ci/reports/mutation-1k.log
          e2fsck -fn artifacts/fskit-ci/tests/fskit-mutated.img \
            2>&1 | tee artifacts/fskit-ci/reports/mutation-fsck-4k.log
          e2fsck -fn artifacts/fskit-ci/tests-1k/fskit-mutated.img \
            2>&1 | tee artifacts/fskit-ci/reports/mutation-fsck-1k.log
          e2fsck -fn artifacts/fskit-ci/tests/fskit-recovered.img \
            2>&1 | tee artifacts/fskit-ci/reports/recovery-fsck-4k.log
          e2fsck -fn artifacts/fskit-ci/tests-1k/fskit-recovered.img \
            2>&1 | tee artifacts/fskit-ci/reports/recovery-fsck-1k.log
          for profile in 4k 1k; do
            artifacts/fskit-ci/tests/fskit-mutation \
              "artifacts/fskit-ci/capacity/ext4-owned-$profile.img" --capacity \
              "artifacts/fskit-ci/capacity/written-$profile.img" \
              2>&1 | tee "artifacts/fskit-ci/reports/capacity-$profile.log"
            e2fsck -fn "artifacts/fskit-ci/capacity/written-$profile.img" \
              2>&1 | tee "artifacts/fskit-ci/reports/capacity-fsck-$profile.log"
          done
      - name: Check offline maintenance ownership and repair
        run: |
          python3 tests/run_fskit_check.py \
            --derived-data artifacts/fskit-ci/DerivedData \
            --fixtures artifacts/fskit-ci/fixtures \
            --debugfs "$(command -v debugfs)" --e2fsck "$(command -v e2fsck)" \
            --output artifacts/fskit-ci/checks \
            2>&1 | tee artifacts/fskit-ci/reports/checks.log
      - name: Check resource-only format and fault handling
        run: |
          python3 tests/fskit_format_resource.py \
            --helper artifacts/fskit-ci/DerivedData/Build/Products/Debug/Ext4CheckResource \
            --debugfs "$(command -v debugfs)" --e2fsck "$(command -v e2fsck)" \
            --output artifacts/fskit-ci/formats \
            2>&1 | tee artifacts/fskit-ci/reports/formats.log
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fskit-sdk26-reports
          retention-days: 7
          path: |
            artifacts/fskit-ci/reports/*.log
            artifacts/fskit-ci/fixtures/*.log
            artifacts/fskit-ci/fixtures/features.txt
            artifacts/fskit-ci/fixtures/tool-versions.txt
            artifacts/fskit-ci/checks/**/*.log
            artifacts/fskit-ci/checks/**/*.json
            artifacts/fskit-ci/formats/**/*.log
            artifacts/fskit-ci/formats/**/*.json

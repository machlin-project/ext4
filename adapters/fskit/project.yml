name: Ext4FSKit
options:
  deploymentTarget:
    macOS: '26.5'
  xcodeVersion: '27.1'
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '26.5'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Ext4DeviceBarrier:
    type: tool
    platform: macOS
    sources:
      - DeviceBarrierService.m
      - Ext4PeerIdentity.m
      - Ext4DeviceBarrier.h
    dependencies:
      - sdk: Foundation.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4.device-barrier
        OTHER_CODE_SIGN_FLAGS: --identifier org.machlin.ext4.device-barrier
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CFLAGS: -Wdeclaration-after-statement
        SKIP_INSTALL: YES
  Ext4DeviceSetup:
    type: application
    platform: macOS
    sources:
      - DeviceSetup.swift
      - path: group.org.machlin.ext4.device-barrier.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: Ext4DeviceBarrier
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchServices
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4.device-setup
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Machlin ext4 Disk Service
        SKIP_INSTALL: YES
  Ext4Core:
    type: library.static
    platform: macOS
    sources:
      - ../../core
      - ../../include
    settings:
      base:
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        OTHER_CFLAGS: -ffreestanding -fno-builtin -Wdeclaration-after-statement
        SKIP_INSTALL: YES
  Ext4FSKitExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - Ext4Extension.swift
      - Ext4FileSystem.m
      - Ext4FileSystem.h
      - Ext4Volume.m
      - Ext4Volume.h
      - Ext4VolumeInternal.h
      - Ext4VolumeIO.m
      - Ext4VolumeReadState.m
      - Ext4VolumeCompatibility.m
      - Ext4VolumeModern.m
      - Ext4VolumeMutation.m
      - Ext4VolumeControl.m
      - Ext4ResourceIO.m
      - Ext4ResourceIO.h
      - Ext4DeviceBarrier.h
      - Ext4DeviceBarrier.m
      - Ext4PeerIdentity.m
      - Ext4Support.m
      - Ext4Support.h
      - Ext4Control.m
      - Ext4Control.h
      - Ext4Crypto.m
      - Ext4Crypto.h
      - Ext4KeyStore.m
      - Ext4KeyStore.h
      - BridgingHeader.h
    dependencies:
      - target: Ext4Core
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4.filesystem
        PROVISIONING_PROFILE_SPECIFIER: $(EXT4_EXTENSION_PROFILE)
        INFOPLIST_FILE: Extension-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Extension.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        REGISTER_APP_GROUPS: YES
        SWIFT_OBJC_BRIDGING_HEADER: BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        OTHER_CFLAGS: -Wdeclaration-after-statement
        SKIP_INSTALL: YES
  Ext4FSKitApp:
    type: application
    platform: macOS
    sources:
      - App.swift
      - ControlCommand.swift
      - DeviceService.swift
      - Ext4ExtensionSettings.h
      - Ext4ExtensionSettings.m
      - Ext4DeviceBarrier.h
      - Ext4DeviceBarrier.m
      - Ext4PeerIdentity.m
      - Ext4Control.m
      - Ext4Control.h
      - Ext4Crypto.m
      - Ext4Crypto.h
      - Ext4KeyStore.m
      - Ext4KeyStore.h
      - AppBridge.h
    dependencies:
      - target: Ext4FSKitExtension
        embed: true
      - target: Ext4DeviceSetup
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: FSKit.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4
        PROVISIONING_PROFILE_SPECIFIER: $(EXT4_APP_PROFILE)
        PRODUCT_NAME: Machlin ext4
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AppBridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        INFOPLIST_KEY_CFBundleDisplayName: Machlin ext4
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_APP_SANDBOX: YES
        REGISTER_APP_GROUPS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO
schemes:
  Ext4FSKitApp:
    build:
      targets:
        Ext4FSKitApp: all
    run:
      config: Debug
    archive:
      config: Release

name: Ext4FSKit
options:
  deploymentTarget:
    macOS: '26.4'
  xcodeVersion: '27.1'
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '26.4'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Ext4Core:
    type: library.static
    platform: macOS
    sources:
      - ../../core
      - ../../include
    settings:
      base:
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        OTHER_CFLAGS: -ffreestanding -fno-builtin -Wdeclaration-after-statement
        SKIP_INSTALL: YES
  Ext4FSKitExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - Ext4Extension.swift
      - Ext4FileSystem.m
      - Ext4FileSystem.h
      - Ext4Volume.m
      - Ext4Volume.h
      - Ext4VolumeInternal.h
      - Ext4VolumeIO.m
      - Ext4VolumeControl.m
      - Ext4ResourceIO.m
      - Ext4ResourceIO.h
      - Ext4Support.m
      - Ext4Support.h
      - Ext4Control.m
      - Ext4Control.h
      - Ext4Crypto.m
      - Ext4Crypto.h
      - Ext4KeyStore.m
      - Ext4KeyStore.h
      - BridgingHeader.h
    dependencies:
      - target: Ext4Core
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4.filesystem
        INFOPLIST_FILE: Extension-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Extension.entitlements
        ENABLE_APP_SANDBOX: YES
        REGISTER_APP_GROUPS: YES
        SWIFT_OBJC_BRIDGING_HEADER: BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        OTHER_CFLAGS: -Wdeclaration-after-statement
        SKIP_INSTALL: YES
  Ext4FSKitApp:
    type: application
    platform: macOS
    sources:
      - App.swift
      - Ext4Control.m
      - Ext4Control.h
      - Ext4Crypto.m
      - Ext4Crypto.h
      - Ext4KeyStore.m
      - Ext4KeyStore.h
      - AppBridge.h
    dependencies:
      - target: Ext4FSKitExtension
        embed: true
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.machlin.ext4
        PRODUCT_NAME: Machlin ext4
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AppBridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../include
        INFOPLIST_KEY_CFBundleDisplayName: Machlin ext4
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_APP_SANDBOX: YES
        REGISTER_APP_GROUPS: YES
schemes:
  Ext4FSKitApp:
    build:
      targets:
        Ext4FSKitApp: all
    run:
      config: Debug
